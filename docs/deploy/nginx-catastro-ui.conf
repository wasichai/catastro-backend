# catastro-ui behind nginx, with GeoServer's WMS behind catastro-backend's authorization (README, «WMS protegido»).
# a template: catastro-core:8091 and geoserver:8080 are the containers' names in the deployment's network, and
# catastro the GeoServer workspace (WASICHAI_GEOSERVER_WORKSPACE); change them to yours. this file is the only source
# of the config; catastro-ui's README points here. it goes in http context (conf.d/), and needs nginx's auth_request
# module (in the official nginx image). after a deploy, docs/deploy/smoke-wms.sh checks it from outside

# the authorization of a WMS request is remembered 60 s (only a 204), so a map's tiles cost one call to the backend
# and not one each. the key is the token plus the whole query but its bbox, the one thing that changes from tile to
# tile and that the authorization does not read: any other difference (a layer more, a parameter in other case) is
# another key and another call. the price: a token revoked, or a READ removed, still gets tiles up to 60 s
proxy_cache_path /var/cache/nginx/wms_auth levels=1 keys_zone=wms_auth:1m max_size=10m inactive=2m use_temp_path=off;

# (inside the subrequest, $request_uri is still the browser's): the first bbox=<value> taken out, nothing else
map $request_uri $wms_auth_clave {
  "~*^(?<antes>[^?]*\?(?:[^&]*&)*?)bbox=[^&]*(?<despues>.*)$" "$antes$despues";
  default $request_uri;
}

# GeoServer as an upstream, so proxy_pass can carry variables without a resolver
upstream geoserver_wms {
  server geoserver:8080;
}

# what GeoServer answers goes out as an image or as nothing the browser runs
map $upstream_http_content_type $wms_content_type {
  "~*^image/" $upstream_http_content_type;
  default "application/octet-stream";
}

server {
  listen 80;
  client_max_body_size 50m;

  location /api/ { proxy_pass http://catastro-core:8091; proxy_set_header Host $host; proxy_read_timeout 600s; }

  # WMS: the browser asks /geoserver/catastro/wms to this origin (catastro-ui#10) with its Bearer (catastro-ui's
  # transformRequest). only that path: never GeoServer's admin UI, REST, WFS, WCS, WMTS, GWC or global services. every
  # request is authorized first by GET /api/catastro/wms/autorizar: 204 passes, 401/403 is what the browser gets
  location = /geoserver/catastro/wms {
    # the authorization reads the uri, not a body: no POST (a WFS or SLD body could name any layer)
    limit_except GET { deny all; }
    auth_request /_wms_auth;
    # a GeoServer error is drawn in the image, never an XML page (the backend refuses a client's own `exceptions`)
    proxy_pass http://geoserver_wms$uri?$args&exceptions=application/vnd.ogc.se_inimage;
    proxy_set_header Host $host;
    # GeoServer serves anonymously: it never sees the token, the cookies or a body
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Content-Type "";
    proxy_hide_header Set-Cookie;
    # a tile is the caller's: nobody keeps it, so a logout or a lost permission is not answered from a cache
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "private, no-store" always;
    # only images: anything else goes as an inert download
    proxy_hide_header Content-Type;
    default_type "";
    add_header Content-Type $wms_content_type always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
  }

  # the subrequest of auth_request: the original uri and the browser's Authorization, nothing else
  location = /_wms_auth {
    internal;
    proxy_pass http://catastro-core:8091/api/catastro/wms/autorizar;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    # a backend that hangs stops the tile, not the map: auth_request answers 500 and the tile is missing
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    # see proxy_cache_path above: only a 204, keyed on the token and the query without its bbox
    proxy_cache wms_auth;
    proxy_cache_key "$http_authorization|$wms_auth_clave";
    proxy_cache_valid 204 60s;
    proxy_cache_methods GET;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
  }

  # anything else of GeoServer's (web admin, REST, WFS, WCS, WMTS, GWC) is not served from here
  location /geoserver/ { return 404; }

  # the SPA. there is no add_header at server level, so each location below sets its own and inherits nothing
  # vite's hashed chunks: a name never changes its content, so they are kept a year. one that is missing (an old
  # index.html asking for a chunk of the previous build) is a 404, never index.html with a 200. ^~ only skips regex
  # locations (there are none); /geoserver/ is another prefix and still wins its own paths
  location ^~ /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    # without always: a 404 is not kept a year, only a chunk that exists
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html is revalidated on every load, so after a deploy the browser gets the one that names the new chunks.
  # try_files of location / redirects a client route (/brechas/panel) here, so its 200 carries the header too
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
