# catastro-ui behind nginx, with GeoServer's WMS behind catastro-backend's authorization (README, «WMS protegido»).
# a template: catastro-core:8091 and geoserver:8080 are the containers' names in the deployment's network; change them
# to yours. this file is the only source of the config; catastro-ui's README points here. needs nginx's auth_request
# module (in the official nginx image)
server {
  listen 80;
  client_max_body_size 50m;

  location /api/ { proxy_pass http://catastro-core:8091; proxy_set_header Host $host; proxy_read_timeout 600s; }

  # WMS: the browser asks /geoserver/ to this origin (catastro-ui#10) with its Bearer (catastro-ui's transformRequest).
  # only the OGC services, never GeoServer's admin UI or REST; every request is authorized first by
  # GET /api/catastro/wms/autorizar: 204 passes, 401/403 is the answer the browser gets
  location ~ ^/geoserver/([A-Za-z0-9_-]+/)?(wms|ows|gwc/service/wms)$ {
    # the authorization reads the uri, not a body: no POST (a WFS or SLD body could name any layer)
    limit_except GET { deny all; }
    auth_request /_wms_auth;
    proxy_pass http://geoserver:8080;
    proxy_set_header Host $host;
    # GeoServer serves anonymously and never sees the token
    proxy_set_header Authorization "";
    # a tile is the caller's: the browser may keep it, a shared cache may not
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private" always;
  }

  # the subrequest of auth_request: the original uri and the browser's Authorization, nothing else
  location = /_wms_auth {
    internal;
    proxy_pass http://catastro-core:8091/api/catastro/wms/autorizar;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
  }

  # anything else of GeoServer's (web admin, REST, WFS, WCS) is not served from here
  location /geoserver/ { return 404; }

  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
