name: catastro

services:
  # postgis: wasichai-gis keeps the lotes' polygons
  postgres:
    image: postgis/postgis:18-3.6
    container_name: catastro-postgres
    environment:
      POSTGRES_USER: catastro
      POSTGRES_PASSWORD: catastro
      POSTGRES_DB: catastro
    ports:
      # 5434, never 5432 (another app's postgres) nor 5433 (srtm's). loopback only: with a remote DOCKER_HOST this
      # would otherwise open the db on the server's public ip
      - '127.0.0.1:${CATASTRO_PG_PORT:-5434}:5432'
    volumes:
      # pg18 images want the mount one level up, data lands in a version subdir
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catastro -d catastro']
      interval: 5s
      timeout: 5s
      retries: 20

  # geoserver: publishes predio_catastral.lote_geom and tramo_via.geom as WMS layers (wasichai-gis). optional: nothing
  # else needs it. it reaches postgis by the service name `postgres` on this compose network, not by localhost
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.6
    container_name: catastro-geoserver
    # opt-in: a plain `docker compose up -d` still starts only postgis
    profiles: ['geoserver']
    environment:
      # from develop/.env, never committed; same value as the one the server uses. empty: GeoServer falls back to its
      # public default password, so always set it before `--profile geoserver up`
      GEOSERVER_ADMIN_USER: ${WASICHAI_GEOSERVER_USERNAME:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${WASICHAI_GEOSERVER_PASSWORD:-}
      SKIP_DEMO_DATA: 'true'
    ports:
      # 8085, never 8080/8081 (other apps). loopback only, like postgres
      - '127.0.0.1:${CATASTRO_GEOSERVER_PORT:-8085}:8080'
    volumes:
      - geoserver-data:/opt/geoserver_data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsu "$$GEOSERVER_ADMIN_USER:$$GEOSERVER_ADMIN_PASSWORD" http://localhost:8080/geoserver/rest/about/version.json']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  geoserver-data:
